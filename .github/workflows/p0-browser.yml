name: P0 browser acceptance

on:
  push:
    branches:
      - fix/p0-transaction-safety-20261111
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      # GitHub hosted runners include Chromium system libraries; avoid flaky apt mirrors.
      - run: npx playwright install chromium
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/claude-game-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/claude_game/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/claude-game-vite.log
          exit 1
      - run: node tests/browser-p0.cjs
