name: README gameplay preview

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/readme-preview.yml'
      - 'tests/readme-preview.cjs'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Start local game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/claude-game-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/claude_game/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/claude-game-vite.log
          exit 1
      - name: Record gameplay frames
        run: node tests/readme-preview.cjs
      - name: Assemble GIF when ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            echo 'ffmpeg unavailable; PNG frames retained as artifact'
            exit 0
          fi
          ffmpeg -hide_banner -loglevel error -y -framerate 2 -i readme-preview/frame-%02d.png -vf 'fps=2,scale=390:-1:flags=lanczos,palettegen' readme-preview/palette.png
          ffmpeg -hide_banner -loglevel error -y -framerate 2 -i readme-preview/frame-%02d.png -i readme-preview/palette.png -lavfi 'fps=2,scale=390:-1:flags=lanczos[x];[x][1:v]paletteuse' readme-preview/gameplay.gif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-gameplay-preview
          path: readme-preview/
          if-no-files-found: ignore
