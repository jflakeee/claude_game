name: README gameplay preview

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/readme-preview.yml'
      - 'tests/readme-preview.cjs'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install chromium
      - name: Start local game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/claude-game-vite.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/claude_game/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/claude-game-vite.log
          exit 1
      - name: Record gameplay frames
        run: node tests/readme-preview.cjs
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Assemble GIF
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 2 -i readme-preview/frame-%02d.png -vf 'fps=2,scale=390:-1:flags=lanczos,palettegen' readme-preview/palette.png
          ffmpeg -hide_banner -loglevel error -y -framerate 2 -i readme-preview/frame-%02d.png -i readme-preview/palette.png -lavfi 'fps=2,scale=390:-1:flags=lanczos[x];[x][1:v]paletteuse' readme-preview/gameplay.gif
      - name: Verify generated GIF
        run: |
          test -s readme-preview/gameplay.gif
          frames="$(ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=nb_read_frames -of default=nokey=1:noprint_wrappers=1 readme-preview/gameplay.gif)"
          echo "Recorded GIF frames: $frames"
          test "$frames" -ge 5
      - name: Publish generated GIF to README
        if: github.ref == 'refs/heads/master'
        run: |
          if [ ! -s readme-preview/gameplay.gif ]; then
            echo 'No GIF produced; README unchanged'
            exit 0
          fi
          mkdir -p docs/media
          cp readme-preview/gameplay.gif docs/media/gameplay.gif
          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text()
          anchor = '## 📸 게임 화면'
          snippet = '![모바일 생존 전투 플레이 미리보기](docs/media/gameplay.gif)\n\n'
          if snippet not in text:
              assert anchor in text
              readme.write_text(text.replace(anchor, anchor + '\n\n' + snippet, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/media/gameplay.gif
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish recorded gameplay GIF'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-gameplay-preview
          path: readme-preview/
          if-no-files-found: ignore
